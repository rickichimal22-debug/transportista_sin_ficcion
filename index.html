<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva de Boletos - Transporte Local</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans antialiased text-gray-800">

    <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg flex flex-col">
        
        <!-- Header Común -->
        <header class="bg-blue-600 text-white p-4 text-center">
            <h1 class="text-xl font-bold">Transportes Fox</h1>
            <p id="subtitulo-header" class="text-xs text-blue-100">Elige una corrida y cantidad de boletos</p>
        </header>

        <!-- Contenido Principal -->
        <main class="p-4 flex-1 flex flex-col">

            <!-- ================= VISTA 1: HORARIOS Y CANTIDAD ================= -->
            <section id="vista-horarios" class="flex flex-col gap-5">
                
                <!-- Selector de Cantidad de Boletos -->
                <div>
                    <h2 class="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-2">1. Cantidad de boletos</h2>
                    <div class="flex gap-2">
                        <button onclick="seleccionarCantidad(1, this)" class="btn-cantidad flex-1 py-2 border-2 border-blue-600 bg-blue-50 text-blue-700 rounded-xl font-bold text-center transition">1</button>
                        <button onclick="seleccionarCantidad(2, this)" class="btn-cantidad flex-1 py-2 border-2 border-gray-200 text-gray-700 rounded-xl font-bold text-center transition hover:border-blue-400">2</button>
                        <button onclick="seleccionarCantidad(3, this)" class="btn-cantidad flex-1 py-2 border-2 border-gray-200 text-gray-700 rounded-xl font-bold text-center transition hover:border-blue-400">3</button>
                        <button onclick="seleccionarCantidad(4, this)" class="btn-cantidad flex-1 py-2 border-2 border-gray-200 text-gray-700 rounded-xl font-bold text-center transition hover:border-blue-400">4</button>
                        <button onclick="seleccionarCantidad(5, this)" class="btn-cantidad flex-1 py-2 border-2 border-gray-200 text-gray-700 rounded-xl font-bold text-center transition hover:border-blue-400">5</button>
                    </div>
                </div>

                <!-- Selección de Horario -->
                <div>
                    <h2 class="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-2">2. Selecciona tu horario</h2>
                    <div class="grid grid-cols-1 gap-3">
                        <button onclick="seleccionarHorario('07:00 AM')" class="p-4 border rounded-xl text-left flex justify-between items-center hover:border-blue-600 hover:bg-blue-50 transition">
                            <div>
                                <span class="block font-bold text-lg">07:00 AM</span>
                                <span class="text-xs text-gray-500">Ruta Centro - Terminal</span>
                            </div>
                            <span class="text-xs bg-green-100 text-green-700 font-semibold px-2.5 py-1 rounded-full">12 disp.</span>
                        </button>
                        
                        <button onclick="seleccionarHorario('12:00 PM')" class="p-4 border rounded-xl text-left flex justify-between items-center hover:border-blue-600 hover:bg-blue-50 transition">
                            <div>
                                <span class="block font-bold text-lg">12:00 PM</span>
                                <span class="text-xs text-gray-500">Ruta Centro - Terminal</span>
                            </div>
                            <span class="text-xs bg-green-100 text-green-700 font-semibold px-2.5 py-1 rounded-full">5 disp.</span>
                        </button>

                        <button onclick="seleccionarHorario('05:00 PM')" class="p-4 border rounded-xl text-left flex justify-between items-center hover:border-blue-600 hover:bg-blue-50 transition">
                            <div>
                                <span class="block font-bold text-lg">05:00 PM</span>
                                <span class="text-xs text-gray-500">Ruta Centro - Terminal</span>
                            </div>
                            <span class="text-xs bg-green-100 text-green-700 font-semibold px-2.5 py-1 rounded-full">18 disp.</span>
                        </button>
                    </div>
                </div>
            </section>

            <!-- ================= VISTA 2: MAPA DE ASIENTOS ESTILO PLANO VEHICULAR ================= -->
            <section id="vista-asientos" class="hidden flex-col flex-1 justify-between">
                <div>
                    <!-- Botón de Regresar y Horario Activo -->
                    <div class="flex justify-between items-center mb-3">
                        <button onclick="regresarAHorarios()" class="text-xs bg-gray-200 hover:bg-gray-300 font-semibold px-3 py-1.5 rounded-lg transition flex items-center gap-1">
                            ← Cambiar selección
                        </button>
                        <span id="badge-resumen" class="text-xs bg-blue-100 text-blue-800 font-semibold px-2.5 py-1 rounded-full"></span>
                    </div>

                    <h2 class="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-2">Selecciona tus <span id="cantidad-texto-titulo">1</span> asientos</h2>
                    
                    <!-- Leyenda -->
                    <div class="flex justify-around text-xs text-gray-600 mb-3 bg-gray-50 p-2 rounded-lg border">
                        <div class="flex items-center gap-1"><span class="w-3 h-3 bg-white border border-gray-300 rounded-sm inline-block"></span> Libre</div>
                        <div class="flex items-center gap-1"><span class="w-3 h-3 bg-blue-600 rounded-sm inline-block"></span> Seleccionado</div>
                        <div class="flex items-center gap-1"><span class="w-3 h-3 bg-red-500 rounded-sm inline-block"></span> Ocupado</div>
                    </div>

                    <!-- Plano del Vehículo (Estilo Butacas de Cine / Distribución Interna) -->
                    <div class="border-4 border-gray-400 rounded-t-[40px] rounded-b-2xl p-4 bg-slate-100 max-w-xs mx-auto shadow-inner relative">
                        
                        <!-- Cabina / Frente del Vehículo -->
                        <div class="flex justify-between items-center border-b-2 border-dashed border-gray-300 pb-3 mb-4 px-2">
                            <div class="text-[10px] bg-gray-200 px-2 py-1 rounded font-bold text-gray-600">🚪 Puerta</div>
                            <div class="text-xs font-bold text-gray-500 flex items-center gap-1">🛞 Chofer</div>
                        </div>

                        <!-- Distribución de Asientos (Filas con Pasillo Central) -->
                        <div id="mapa-asientos" class="flex flex-col gap-2.5">
                            <!-- Generado dinámicamente por JavaScript simulando filas de 4 (2 y 2 con pasillo) -->
                        </div>

                        <!-- Parte trasera -->
                        <div class="mt-4 pt-2 border-t border-gray-300 text-center text-[10px] text-gray-400 font-bold tracking-widest uppercase">
                            Parte Trasera
                        </div>
                    </div>
                </div>

                <!-- Resumen y Continuar (Fijo abajo) -->
                <div class="mt-4 bg-blue-50 p-3 rounded-xl flex justify-between items-center border border-blue-100">
                    <div>
                        <p class="text-xs text-gray-600">Asientos elegidos:</p>
                        <p id="asiento-texto" class="font-bold text-blue-700">Ninguno</p>
                    </div>
                    <button onclick="continuarCompra()" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-sm font-semibold hover:bg-blue-700 transition shadow">
                        Continuar
                    </button>
                </div>
            </section>

        </main>
    </div>

    <script>
        let cantidadBoletos = 1;
        let horarioElegido = '';
        let asientosElegidos = [];

        function seleccionarCantidad(cantidad, elemento) {
            cantidadBoletos = cantidad;
            document.querySelectorAll('.btn-cantidad').forEach(btn => {
                btn.classList.remove('border-blue-600', 'bg-blue-50', 'text-blue-700');
                btn.classList.add('border-gray-200', 'text-gray-700');
            });
            elemento.classList.remove('border-gray-200', 'text-gray-700');
            elemento.classList.add('border-blue-600', 'bg-blue-50', 'text-blue-700');
        }

        function seleccionarHorario(horario) {
            horarioElegido = horario;
            asientosElegidos = [];

            document.getElementById('badge-resumen').innerText = `${horario} (${cantidadBoletos} boletos)`;
            document.getElementById('cantidad-texto-titulo').innerText = cantidadBoletos;
            document.getElementById('subtitulo-header').innerText = `Corrida: ${horario}`;
            document.getElementById('asiento-texto').innerText = 'Ninguno';
            
            document.getElementById('vista-horarios').classList.add('hidden');
            document.getElementById('vista-asientos').classList.remove('hidden');
            document.getElementById('vista-asientos').classList.add('flex');
            
            generarAsientosVehiculo();
        }

        function regresarAHorarios() {
            asientosElegidos = [];
            document.getElementById('subtitulo-header').innerText = 'Elige una corrida y cantidad de boletos';
            document.getElementById('vista-asientos').classList.add('hidden');
            document.getElementById('vista-asientos').classList.remove('flex');
            document.getElementById('vista-horarios').classList.remove('hidden');
        }

        function generarAsientosVehiculo() {
            const contenedor = document.getElementById('mapa-asientos');
            contenedor.innerHTML = '';
            
            const ocupados = [3, 7, 12, 18]; // Ejemplo de asientos ocupados
            const totalAsientos = 20; // 5 filas de 4 asientos (2 izq, pasillo, 2 der)
            
            let filaDiv = null;

            for (let i = 1; i <= totalAsientos; i++) {
                // Crear una nueva fila cada 4 asientos para simular el plano de la van
                if ((i - 1) % 4 === 0) {
                    filaDiv = document.createElement('div');
                    filaDiv.className = "flex justify-between items-center gap-4 px-2";
                    contenedor.appendChild(filaDiv);
                }

                // Crear contenedor para agrupar de 2 en 2 (izq y der con pasillo al centro en el asiento 2 y 3)
                if ((i - 1) % 4 === 2) {
                    // Espacio visual para simular el pasillo central de la van
                    const pasillo = document.createElement('div');
                    pasillo.className = "w-6 flex items-center justify-center text-[10px] text-gray-300 font-bold";
                    pasillo.innerText = "│";
                    filaDiv.appendChild(pasillo);
                }

                const btn = document.createElement('button');
                btn.innerText = i;
                btn.className = "w-10 h-10 rounded-xl text-xs font-bold border transition flex items-center justify-center shadow-sm ";
                
                if (ocupados.includes(i)) {
                    // Ocupado -> Rojo
                    btn.classList.add('bg-red-500', 'border-red-600', 'text-white', 'cursor-not-allowed');
                    btn.disabled = true;
                } else {
                    // Libre -> Blanco
                    btn.classList.add('bg-white', 'border-gray-300', 'text-gray-700', 'hover:border-blue-600', 'hover:bg-blue-50');
                    btn.onclick = () => alternarAsiento(i, btn);
                }
                filaDiv.appendChild(btn);
            }
        }

        function alternarAsiento(numero, elemento) {
            const index = asientosElegidos.indexOf(numero);

            if (index > -1) {
                asientosElegidos.splice(index, 1);
                elemento.classList.remove('bg-blue-600', 'text-white', 'border-blue-600', 'shadow-md');
                elemento.classList.add('bg-white', 'text-gray-700', 'border-gray-300');
            } else {
                if (asientosElegidos.length >= cantidadBoletos) {
                    alert(`Solo puedes seleccionar ${cantidadBoletos} asiento(s) según los boletos que pediste.`);
                    return;
                }
                asientosElegidos.push(numero);
                elemento.classList.remove('bg-white', 'text-gray-700', 'border-gray-300');
                elemento.classList.add('bg-blue-600', 'text-white', 'border-blue-600', 'shadow-md');
            }

            if (asientosElegidos.length > 0) {
                asientosElegidos.sort((a, b) => a - b);
                document.getElementById('asiento-texto').innerText = `Asientos: #${asientosElegidos.join(', #')}`;
            } else {
                document.getElementById('asiento-texto').innerText = 'Ninguno';
            }
        }

        function continuarCompra() {
            if (asientosElegidos.length < cantidadBoletos) {
                alert(`Por favor selecciona los ${cantidadBoletos} asientos correspondientes antes de continuar.`);
                return;
            }
            alert(`¡Excelente! Horario: ${horarioElegido}, Boletos: ${cantidadBoletos}, Asientos: #${asientosElegidos.join(', #')}.`);
        }
    </script>
</body>
</html>
