<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva de Boletos - Transporte Local</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans antialiased text-gray-800">

    <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg flex flex-col">
        
        <!-- Header -->
        <header class="bg-blue-600 text-white p-4 text-center">
            <h1 class="text-xl font-bold">Transporte Local Express</h1>
            <p class="text-xs text-blue-100">Reserva tu asiento fácil y rápido</p>
        </header>

        <!-- Contenido Principal -->
        <main class="p-4 flex-1 flex flex-col gap-6">

            <!-- Paso 1: Selección de Fecha y Horario -->
            <section>
                <h2 class="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-2">1. Selecciona tu horario</h2>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="seleccionarHorario('07:00 AM')" class="p-3 border rounded-xl text-center hover:border-blue-600 focus:border-blue-600 focus:bg-blue-50 transition">
                        <span class="block font-bold text-lg">07:00 AM</span>
                        <span class="text-xs text-green-600 font-medium">12 lugares disp.</span>
                    </button>
                    <button onclick="seleccionarHorario('12:00 PM')" class="p-3 border rounded-xl text-center hover:border-blue-600 focus:border-blue-600 focus:bg-blue-50 transition">
                        <span class="block font-bold text-lg">12:00 PM</span>
                        <span class="text-xs text-green-600 font-medium">5 lugares disp.</span>
                    </button>
                    <button onclick="seleccionarHorario('05:00 PM')" class="p-3 border rounded-xl text-center hover:border-blue-600 focus:border-blue-600 focus:bg-blue-50 transition">
                        <span class="block font-bold text-lg">05:00 PM</span>
                        <span class="text-xs text-green-600 font-medium">18 lugares disp.</span>
                    </button>
                </div>
            </section>

            <!-- Paso 2: Mapa de Asientos (Crafter 21 Lugares) -->
            <section id="seccion-asientos" class="hidden">
                <div class="flex justify-between items-center mb-2">
                    <h2 class="text-sm font-semibold text-gray-500 uppercase tracking-wider">2. Elige tu asiento</h2>
                    <span id="horario-seleccionado" class="text-xs bg-blue-100 text-blue-800 font-semibold px-2 py-1 rounded-full"></span>
                </div>
                
                <!-- Leyenda -->
                <div class="flex justify-around text-xs text-gray-600 mb-4 bg-gray-50 p-2 rounded-lg">
                    <div class="flex items-center gap-1"><span class="w-3 h-3 bg-white border border-gray-300 rounded-sm inline-block"></span> Libre</div>
                    <div class="flex items-center gap-1"><span class="w-3 h-3 bg-blue-600 rounded-sm inline-block"></span> Seleccionado</div>
                    <div class="flex items-center gap-1"><span class="w-3 h-3 bg-gray-300 rounded-sm inline-block"></span> Ocupado</div>
                </div>

                <!-- Vehículo (Crafter) -->
                <div class="border-2 border-gray-300 rounded-2xl p-4 bg-gray-50 max-w-xs mx-auto">
                    <!-- Frente / Chofer -->
                    <div class="flex justify-between border-b pb-3 mb-4 text-xs font-bold text-gray-400">
                        <span>🚪 Puerta</span>
                        <span>🚌 Volante (Chofer)</span>
                    </div>

                    <!-- Cuadrícula de Asientos (Simulando distribución Crafter 21) -->
                    <div id="mapa-asientos" class="grid grid-cols-4 gap-2">
                        <!-- Se generarán por script o estáticos -->
                    </div>
                </div>

                <!-- Resumen y Continuar -->
                <div class="mt-4 bg-blue-50 p-3 rounded-xl flex justify-between items-center">
                    <div>
                        <p class="text-xs text-gray-600">Asiento seleccionado:</p>
                        <p id="asiento-texto" class="font-bold text-blue-700">Ninguno</p>
                    </div>
                    <button onclick="continuarCompra()" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-sm font-semibold hover:bg-blue-700 transition">
                        Continuar
                    </button>
                </div>
            </section>

        </main>
    </div>

    <script>
        let horarioElegido = '';
        let asientoElegido = null;

        function seleccionarHorario(horario) {
            horarioElegido = horario;
            document.getElementById('horario-seleccionado').innerText = horario;
            document.getElementById('seccion-asientos').classList.remove('hidden');
            generarAsientos();
        }

        function generarAsientos() {
            const contenedor = document.getElementById('mapa-asientos');
            contenedor.innerHTML = '';
            
            // Simulamos 21 asientos (algunos ocupados aleatoriamente para realismo)
            const ocupados = [3, 7, 12]; 

            for (let i = 1; i <= 21; i++) {
                const btn = document.createElement('button');
                btn.innerText = i;
                btn.className = "py-3 rounded-lg text-sm font-bold border transition flex items-center justify-center ";
                
                if (ocupados.includes(i)) {
                    btn.classList.add('bg-gray-300', 'border-gray-300', 'text-gray-500', 'cursor-not-allowed');
                    btn.disabled = true;
                } else {
                    btn.classList.add('bg-white', 'border-gray-300', 'text-gray-700', 'hover:border-blue-600');
                    btn.onclick = () => seleccionarAsiento(i, btn);
                }
                contenedor.appendChild(btn);
            }
        }

        function seleccionarAsiento(numero, elemento) {
            // Quitar selección anterior
            document.querySelectorAll('#mapa-asientos button').forEach(b => {
                if(!b.disabled && b.classList.contains('bg-blue-600')) {
                    b.classList.remove('bg-blue-600', 'text-white', 'border-blue-600');
                    b.classList.add('bg-white', 'text-gray-700', 'border-gray-300');
                }
            });

            // Marcar nuevo
            elemento.classList.remove('bg-white', 'text-gray-700', 'border-gray-300');
            elemento.classList.add('bg-blue-600', 'text-white', 'border-blue-600');
            
            asientoElegido = numero;
            document.getElementById('asiento-texto').innerText = `Asiento #${numero}`;
        }

        function continuarCompra() {
            if (!asientoElegido) {
                alert('Por favor selecciona un asiento antes de continuar.');
                return;
            }
            alert(`¡Excelente! Horario: ${horarioElegido}, Asiento: ${asientoElegido}. Aquí abriría el formulario de datos y el envío por WhatsApp.`);
        }
    </script>
</body>
</html>
